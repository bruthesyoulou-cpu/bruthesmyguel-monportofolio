<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruthes Myguel — Product Builder</title>
<meta name="description" content="Portfolio de Bruthes Myguel : produits numériques modernes et applications innovantes.">
<meta property="og:title" content="Bruthes Myguel — Product Builder">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4ED;--sf:#FFFFFF;--tx:#1B1B1B;--mu:#5E5A50;--ln:rgba(27,27,27,.13);--am:#E9A92A;--ol:#556B2F;--go:#B8860B;--ink:#111111;--sh:0 1px 2px rgba(17,17,17,.06),0 10px 24px -12px rgba(17,17,17,.18);--hf:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--bf:"Figtree","Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1628;--sf:#131F35;--tx:#FFFFFF;--mu:#A3B2CC;--ln:rgba(255,255,255,.14);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#0D1628;--sf:#131F35;--tx:#FFFFFF;--mu:#A3B2CC;--ln:rgba(255,255,255,.14);--sh:0 1px 2px rgba(0,0,0,.3),0 10px 24px -12px rgba(0,0,0,.55)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 var(--bf);overflow-x:hidden}
h1,h2,h3{font-family:var(--hf);line-height:1.08;letter-spacing:-.02em;margin:0}
p{margin:0}a{color:inherit}
:focus-visible{outline:3px solid var(--am);outline-offset:3px;border-radius:6px}
.w{width:min(1060px,100% - 40px);margin-inline:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font:700 1.2rem var(--hf);text-decoration:none}
.tg{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);cursor:pointer;box-shadow:var(--sh)}
nav{display:flex;gap:20px;overflow-x:auto;padding-bottom:10px;font-size:.92rem;color:var(--mu)}
nav a{text-decoration:none;flex:none}nav a:hover{color:var(--tx)}
.hero{padding:64px 0 48px}
.hg{display:grid;grid-template-columns:1.5fr .7fr;gap:40px;align-items:center}
@media(max-width:800px){.hg{grid-template-columns:1fr}}
h1{font-size:clamp(2.2rem,7vw,4.6rem);font-weight:700}
.role{margin-top:16px;font:500 clamp(1.05rem,2.2vw,1.3rem) var(--hf);color:var(--go)}
:root[data-theme="dark"] .role{color:var(--am)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .role{color:var(--am)}}
.tag{margin-top:14px;max-width:46ch;color:var(--mu);font-size:1.1rem}
.cta{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:600 1rem var(--bf);text-decoration:none;box-shadow:var(--sh);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.btn.p{background:var(--am);border-color:var(--am);color:var(--ink)}
.pic{aspect-ratio:4/5;max-width:340px;width:100%;justify-self:end;border-radius:26px;border:1px solid var(--ln);background:var(--sf);box-shadow:var(--sh);overflow:hidden;display:grid;place-items:center;font:700 5rem var(--hf)}
.pic img{width:100%;height:100%;object-fit:cover}
@media(max-width:800px){.pic{justify-self:start;max-width:220px}}
section.s{padding:72px 0;border-top:1px solid var(--ln)}
h2{font-size:clamp(1.9rem,4.5vw,2.8rem);margin-bottom:28px}
.about{max-width:62ch;font-size:1.12rem;white-space:pre-line}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:22px;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .25s}
.c:hover{transform:translateY(-4px)}
.c img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;margin-bottom:14px}
.c h3{font-size:1.25rem}.c p{margin-top:8px;color:var(--mu);font-size:.98rem}
.tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.tags span{padding:2px 10px;border:1px solid var(--ln);border-radius:99px;font-size:.82rem;color:var(--mu)}
.ln{margin-top:auto;padding-top:14px;display:flex;gap:16px;font-weight:600;font-size:.95rem}
.sk{display:flex;flex-wrap:wrap;gap:10px}
.sk div{padding:10px 18px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);box-shadow:var(--sh);font-weight:500}
.sk small{display:block;color:var(--mu);font-weight:400}
.note{color:var(--mu);font-size:.95rem}
footer{padding:32px 0 48px;border-top:1px solid var(--ln);color:var(--mu);font-size:.92rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.glass{background:color-mix(in srgb,var(--sf) 70%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:rgba(233,169,42,.4);box-shadow:0 0 0 1px rgba(233,169,42,.14),var(--sh)}
.pr{margin:10px 0 14px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--mu);font:.85rem/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:180px;overflow:auto}
.cp{align-self:flex-start;margin-top:auto;cursor:pointer}.cp.ok{background:var(--ol);border-color:var(--ol);color:#fff}
.cf{position:fixed;z-index:50;pointer-events:none;font:600 .9rem ui-monospace,monospace;color:var(--am);animation:cf .9s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(40deg);opacity:0}}
.price{margin-top:10px;font-weight:600;color:var(--go)}
button.btn{cursor:pointer}
dialog.fun{border:1px solid var(--ln);border-radius:22px;background:var(--bg);color:var(--tx);width:min(480px,100% - 32px);padding:26px;max-height:90svh;overflow:auto}
dialog.fun::backdrop{background:rgba(9,10,15,.72)}
dialog.fun>h3{padding-right:48px}
.x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);cursor:pointer}
.num{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;margin:8px 0;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
.fm{display:grid;gap:12px}.fm label{display:grid;gap:4px;font-weight:600}
.fm input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.launch{position:relative;height:150px;overflow:hidden;border:1px solid var(--ln);border-radius:14px;background:var(--sf);margin:14px 0}
.rk{position:absolute;left:50%;bottom:10px;font-size:2.4rem;transform:translateX(-50%);animation:up 1.8s ease-in forwards}
@keyframes up{to{transform:translate(-50%,-170px)}}
.scan{position:absolute;left:0;right:0;height:3px;background:var(--am);animation:sc 1.1s linear infinite alternate}
@keyframes sc{from{top:0}to{top:100%}}
.okic{font-size:3rem;color:var(--ol)}
</style>
</head>

function sent(f){var o=el('div','okic','✓');o.setAttribute('aria-hidden','true');view([o,el('h3',0,'Reçu envoyé'),el('p','note','Votre paiement va être vérifié. Vous recevrez votre clé d\'accès une fois l\'inscription validée.'),B('J\'ai ma clé','btn p',function(){unlock(f)})])}

if(P.telegram){var a=el('a','btn p','Ouvrir Telegram');a.href='https://t.me/'+P.telegram.replace(/^@/,'');a.target='_blank';a.rel='noopener';a.style.marginTop='14px';n.push(a)}view(n)}
function unlock(f){var fm=el('form','fm');fm.appendChild(el('h3',0,'Débloquer la formation'));var i=el('input');i.required=true;i.placeholder='Votre clé d\'accès';var l=el('label',0,'Clé d\'accès');l.appendChild(i);fm.appendChild(l);var out=el('p','note');out.setAttribute('role','status');var b=el('button','btn p','Débloquer');fm.appendChild(b);fm.appendChild(out);
fm.onsubmit=function(e){e.preventDefault();b.disabled=true;out.textContent='Vérification…';
fetch(P.endpoint?P.endpoint.replace('inscription','debloquer'):'/.netlify/functions/debloquer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:i.value})}).then(function(r){return r.json()}).then(function(j){b.disabled=false;out.textContent='';if(j.ok){var c=String(j.contenu);if(/^https?:\/\//.test(c)){var a=el('a','btn p','Accéder à la formation');a.href=c;a.target='_blank';a.rel='noopener';out.appendChild(a)}else out.textContent=c}else out.textContent='Clé invalide.'}).catch(function(){b.disabled=false;out.textContent='Service indisponible, réessayez plus tard.'})};view([fm])}
if(D.formations&&D.formations.length){var fg=el('div','g');D.formations.forEach(function(f){var c=el('article','c');c.appendChild(el('h3',0,f.title));if(f.description)c.appendChild(el('p',0,f.description));
[['Objectifs',f.objectifs],['Prérequis',f.prerequis]].forEach(function(x){if(x[1]){var p=el('p');p.appendChild(el('b',0,x[0]+' : '));p.appendChild(document.createTextNode(x[1]));c.appendChild(p)}});
if(f.prix)c.appendChild(el('p','price',f.prix));var b=B('Débloquer la formation','btn p',function(){openFunnel(f)});b.style.marginTop='16px';c.appendChild(b);fg.appendChild(c)});sec('formations','Formations','Formations & Masterclasses',fg)}
var ct=el('div');var has=D.email||D.whatsapp||D.socials.length;
if(has){var r=el('div','cta');if(D.email)r.appendChild(link('Écrire un email','mailto:'+D.email,'btn p'));
if(D.whatsapp)r.appendChild(link('WhatsApp','https://wa.me/'+D.whatsapp.replace(/\D/g,''),'btn',1));
D.socials.forEach(function(s){r.appendChild(link(s.label,s.url,'btn',1))});ct.appendChild(r)}
else ct.appendChild(el('p','note','Ajoutez votre email, votre numéro WhatsApp ou vos réseaux dans le fichier pour afficher vos moyens de contact ici.'));
sec('contact','Contact','Parlons de votre projet',ct);

var n=$('nav');nav.forEach(function(x){n.appendChild(link(x[1],'#'+x[0]))});
$('foot').textContent='© 2026 '+D.company+' . Conçu et construit en public.';
var R=document.documentElement;try{var th=localStorage.getItem('th');if(th)R.dataset.theme=th}catch(e){}
$('tg').onclick=function(){var d=R.dataset.theme?R.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches,x=d?'light':'dark';R.dataset.theme=x;try{localStorage.setItem('th',x)}catch(e){}};
})();
</script>
